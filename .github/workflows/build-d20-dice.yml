name: Build D20 Dice for Windows

on:
  push:
    branches: [ main ]
    paths:
      - 'd20-dice/**'
      - '.github/workflows/build-d20-dice.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build D20 Dice OBS plugin DLL
        shell: pwsh
        run: ./d20-dice/scripts/build-ci.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer EXE
        shell: pwsh
        working-directory: d20-dice
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ".\installer\d20-dice.iss"'

      - name: Upload D20Dice-Setup
        uses: actions/upload-artifact@v4
        with:
          name: D20Dice-Setup
          path: d20-dice/dist/D20Dice-Setup.exe
          if-no-files-found: error
