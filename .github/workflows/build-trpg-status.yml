name: Build TRPG Status for Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'trpg-status/**'
      - '.github/workflows/build-trpg-status.yml'
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin
        shell: pwsh
        run: ./trpg-status/scripts/build-ci.ps1
      - name: Compile installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'trpg-status\installer\trpg-status.iss'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TRPGStatus-Setup
          path: trpg-status/installer/output/TRPGStatus-Setup.exe
